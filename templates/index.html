<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cosmo's Interactive Space & Solar System Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010206;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        
        /* Speech Bubble */
        #speech-bubble {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid rgba(99, 102, 241, 0.85);
            color: #f8fafc;
            padding: 10px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 500;
            max-width: 260px;
            text-align: left;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translateY(-5px);
        }
        #speech-bubble.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Mobile Layout Adjustments: Hide desktop controls, show bottom mic button */
        @media (max-width: 768px) {
            #planet-controls-container,
            #ui-toolbar {
                display: none !important;
            }
            #top-mic-container {
                position: absolute;
                bottom: 25px;
                left: 50%;
                transform: translateX(-50%);
                top: auto;
                right: auto;
                z-index: 25;
            }
        }

        /* Desktop Controls Styles */
        @media (min-width: 769px) {
            #top-mic-container {
                position: absolute;
                top: 20px;
                right: 20px;
                z-index: 25;
            }
        }

        #planet-controls-container {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }
        .action-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(51, 65, 85, 1);
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .action-btn:hover {
            background: rgba(79, 70, 229, 0.9);
            border-color: rgba(99, 102, 241, 1);
            color: white;
        }
        .action-btn.active {
            background: rgb(79, 70, 229);
            border-color: rgb(99, 102, 241);
            color: white;
        }
        #speed-control-box {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(51, 65, 85, 1);
            padding: 8px 14px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e2e8f0;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(8px);
        }
        #speed-slider {
            accent-color: #6366f1;
            cursor: pointer;
            width: 90px;
        }
        #ui-toolbar {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            z-index: 20;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 16px;
            pointer-events: auto;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        /* Mode Colors */
        .mic-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(203, 213, 225, 1);
            color: #0f172a;
        }
        .mic-btn.state-active-hearing {
            background: rgba(220, 38, 38, 0.9); /* Red */
            border-color: rgba(239, 68, 68, 1);
            color: white;
            animation: pulse-red 1.5s infinite;
        }
        .mic-btn.state-listening {
            background: rgba(16, 185, 129, 0.9); /* Green */
            border-color: rgba(52, 211, 153, 1);
            color: white;
            animation: pulse-green 1.5s infinite;
        }
        .mic-btn.state-thinking {
            background: rgba(234, 179, 8, 0.9); /* Yellow */
            border-color: rgba(250, 204, 21, 1);
            color: white;
            animation: pulse-yellow 1.5s infinite;
        }
        .mic-btn.state-talking {
            background: rgba(37, 99, 235, 0.9); /* Blue */
            border-color: rgba(96, 165, 250, 1);
            color: white;
            animation: pulse-blue 1.5s infinite;
        }

        @keyframes pulse-red {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
        }
        @keyframes pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        @keyframes pulse-yellow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
        @keyframes pulse-blue {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
    </style>
</head>
<body>

    <div id="loading">Loading Immersive Space...</div>
    <div id="canvas-container"></div>
    <div id="speech-bubble"></div>

    <div id="top-mic-container">
        <button id="mic-toggle" class="action-btn mic-btn" onclick="toggleVoiceRecognition()">🎤 Ask Cosmo</button>
    </div>

    <div id="planet-controls-container">
        <button id="constellation-btn" class="action-btn" onclick="toggleConstellations()">✨ Constellations</button>
        <div id="speed-control-box">
            <span>🪐 Orbit: <span id="speed-val">1.0</span>x</span>
            <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1.0" oninput="updateOrbitSpeed(this.value)">
        </div>
    </div>

    <div id="ui-toolbar">
        <button class="action-btn" onclick="playAction('Idle')">Idle</button>
        <button class="action-btn" onclick="playAction('Walking')">Walk</button>
        <button class="action-btn" onclick="playAction('Running')">Run</button>
        <button class="action-btn active" onclick="playAction('Dance')">Dance</button>
        <button class="action-btn" onclick="playAction('Jump')">Jump</button>
        <button class="action-btn" onclick="playAction('Wave')">Wave</button>
        <button class="action-btn" onclick="playAction('Punch')">Punch</button>
        <button class="action-btn" onclick="playAction('Yes')">Thumbs Up</button>
        <button class="action-btn" onclick="playAction('Sitting')">Sit</button>
        <button class="action-btn" onclick="playAction('Death')">Sleep</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const isMobile = window.innerWidth <= 768;

        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010206);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -1, isMobile ? 24 : 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, -5.0, 0);

        controls.mouseButtons = {
            LEFT: null,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
        };

        renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

        const ambientLight = new THREE.AmbientLight(0x222233, 1.0);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 4.0);
        sunLight.position.set(-20, 15, 20);
        scene.add(sunLight);

        const clickableObjects = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- BACKGROUND STARS ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 3000;
        const starPos = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 600;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ size: 0.6, color: 0xffffff, transparent: true, opacity: 0.9 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // --- CONSTELLATIONS ---
        const constellationGroup = new THREE.Group();
        constellationGroup.visible = false;
        scene.add(constellationGroup);

        function generateConstellations() {
            const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 });
            for (let i = 0; i < 8; i++) {
                const points = [];
                let curr = new THREE.Vector3(
                    (Math.random() - 0.5) * 300,
                    (Math.random() - 0.5) * 200,
                    -100 - Math.random() * 100
                );
                points.push(curr);

                for (let j = 0; j < 4; j++) {
                    const next = curr.clone().add(new THREE.Vector3(
                        (Math.random() - 0.5) * 40,
                        (Math.random() - 0.5) * 40,
                        (Math.random() - 0.5) * 20
                    ));
                    points.push(next);
                    curr = next;
                }

                const geom = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geom, lineMat);
                const starNodeGeo = new THREE.SphereGeometry(1.5, 8, 8);
                const starNodeMat = new THREE.MeshBasicMaterial({ color: 0x93c5fd });

                points.forEach(pt => {
                    const node = new THREE.Mesh(starNodeGeo, starNodeMat);
                    node.position.copy(pt);
                    constellationGroup.add(node);
                });
                constellationGroup.add(line);
            }
        }
        generateConstellations();

        window.toggleConstellations = function() {
            constellationGroup.visible = !constellationGroup.visible;
            const btn = document.getElementById('constellation-btn');
            if (constellationGroup.visible) {
                btn.classList.add('active');
                robotSpeak("Constellation mode enabled!");
            } else {
                btn.classList.remove('active');
                robotSpeak("Constellation mode disabled.");
            }
        };

        function createPlanetTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            if (type === 'earth') {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#15803d';
                ctx.beginPath();
                ctx.ellipse(300, 150, 120, 80, 0, 0, Math.PI * 2);
                ctx.ellipse(700, 180, 140, 90, 0.2, 0, Math.PI * 2);
                ctx.ellipse(550, 280, 160, 110, 0.1, 0, Math.PI * 2);
                ctx.fill();
            } else if (type === 'jupiter') {
                const colors = ['#b45309', '#d97706', '#92400e', '#f59e0b', '#78350f'];
                const stripeHeight = canvas.height / colors.length;
                colors.forEach((col, idx) => {
                    ctx.fillStyle = col;
                    ctx.fillRect(0, idx * stripeHeight, canvas.width, stripeHeight + 2);
                });
            }
            return new THREE.CanvasTexture(canvas);
        }

        // --- SUN & PLANET SYSTEM PUSHED DEEP INTO THE BACKGROUND (Z = -45) ---
        const sunGroup = new THREE.Group();
        sunGroup.position.set(0, 4.0, -45); // Pushed far back behind Cosmo so nothing ever overlaps the foreground
        sunGroup.rotation.x = 0.4;
        sunGroup.rotation.z = -0.2;
        scene.add(sunGroup);

        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(7.0, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xf59e0b })
        );
        sunMesh.geometry.computeBoundingSphere();
        sunMesh.userData = { planetName: "Sun", originalScale: sunMesh.scale.x };
        sunGroup.add(sunMesh);
        clickableObjects.push(sunMesh);

        const localSunLight = new THREE.PointLight(0xffedd5, 8.0, 400);
        sunGroup.add(localSunLight);

        const planetOrbits = [];
        const planetSpeeds = [];
        let globalOrbitSpeedMultiplier = isMobile ? 2.5 : 1.0;

        window.updateOrbitSpeed = function(val) {
            globalOrbitSpeedMultiplier = parseFloat(val);
            document.getElementById('speed-val').innerText = globalOrbitSpeedMultiplier.toFixed(1);
        };

        function createOrbitPlanet(radius, color, distance, speed, hasRings = false, textureType = null, customName = null) {
            const orbit = new THREE.Group();
            sunGroup.add(orbit);

            const orbitLineGeo = new THREE.RingGeometry(distance - 0.06, distance + 0.06, 128);
            const orbitLineMat = new THREE.MeshBasicMaterial({ 
                color: color || 0x38bdf8, 
                side: THREE.DoubleSide, 
                transparent: true, 
                opacity: 0.45,
                blending: THREE.AdditiveBlending 
            });
            const orbitLine = new THREE.Mesh(orbitLineGeo, orbitLineMat);
            orbitLine.rotation.x = Math.PI / 2;
            sunGroup.add(orbitLine);

            const material = textureType ? 
                new THREE.MeshStandardMaterial({ map: createPlanetTexture(textureType), roughness: 0.6 }) : 
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });

            const geo = new THREE.SphereGeometry(radius, 32, 32);
            geo.computeBoundingSphere();
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.x = distance;
            orbit.add(mesh);

            const name = customName || getPlanetName(distance);
            mesh.userData = { planetName: name, originalScale: mesh.scale.x };
            clickableObjects.push(mesh);

            if (hasRings) {
                const ringGeo = new THREE.RingGeometry(radius * 1.3, radius * 1.9, 32);
                ringGeo.computeBoundingSphere();
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xd4d4d8, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.2;
                ring.userData = { planetName: "Saturn", originalScale: ring.scale.x };
                mesh.add(ring);
                clickableObjects.push(ring);
            }

            planetOrbits.push(orbit);
            planetSpeeds.push(speed);
            return mesh;
        }

        function getPlanetName(distance) {
            if (distance === 10) return "Mercury";
            if (distance === 14) return "Venus";
            if (distance === 19) return "Earth";
            if (distance === 24) return "Mars";
            if (distance === 30) return "Jupiter";
            if (distance === 36) return "Saturn";
            if (distance === 42) return "Uranus";
            if (distance === 48) return "Neptune";
            return "Planet";
        }

        createOrbitPlanet(0.35, 0xa1a1aa, 10, 0.14);
        createOrbitPlanet(0.7, 0xf97316, 14, 0.11);
        const earthMesh = createOrbitPlanet(0.9, 0x2563eb, 19, 0.08, false, 'earth', "Earth");
        
        const moonGeo = new THREE.SphereGeometry(0.2, 16, 16);
        moonGeo.computeBoundingSphere();
        const moonMesh = new THREE.Mesh(moonGeo, new THREE.MeshStandardMaterial({ color: 0x9ca3af }));
        moonMesh.userData = { planetName: "Moon", originalScale: moonMesh.scale.x };
        earthMesh.add(moonMesh);
        clickableObjects.push(moonMesh);

        createOrbitPlanet(0.6, 0xdc2626, 24, 0.06);
        createOrbitPlanet(1.4, 0xb45309, 30, 0.035, false, 'jupiter');
        createOrbitPlanet(1.2, 0xfde047, 36, 0.025, true);
        createOrbitPlanet(0.9, 0x38bdf8, 42, 0.018);
        createOrbitPlanet(0.85, 0x3b82f6, 48, 0.012);

        // --- ROCKET SHIP POSITIONED DIRECTLY BESIDE COSMO (FOREGROUND) ---
        const rocketGroup = new THREE.Group();
        const rocketOriginalPos = new THREE.Vector3(4.4, -13.0, 1.0);
        rocketGroup.position.copy(rocketOriginalPos);
        rocketGroup.scale.set(1.4, 2.3, 1.4);
        scene.add(rocketGroup);

        const metalMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.8, roughness: 0.2 });
        const redMat = new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.5, roughness: 0.3 });
        const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.9, roughness: 0.2 });
        const windowMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.8 });

        const bodyMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 2.0, 32), metalMat);
        bodyMesh.position.y = 1.0;
        rocketGroup.add(bodyMesh);

        const noseMesh = new THREE.Mesh(new THREE.ConeGeometry(0.4, 0.9, 32), redMat);
        noseMesh.position.y = 2.45;
        rocketGroup.add(noseMesh);

        const windowMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 0.1, 16), windowMat);
        windowMesh.rotation.x = Math.PI / 2;
        windowMesh.position.set(0, 1.3, 0.4);
        rocketGroup.add(windowMesh);

        const flameGeo = new THREE.ConeGeometry(0.5, 2.0, 16);
        const flameMat = new THREE.MeshBasicMaterial({ color: 0xf97316, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending });
        const rocketFlame = new THREE.Mesh(flameGeo, flameMat);
        rocketFlame.position.y = -1.3;
        rocketFlame.rotation.x = Math.PI;
        rocketFlame.visible = false;
        rocketGroup.add(rocketFlame);

        rocketGroup.userData = { isRocket: true, originalScale: rocketGroup.scale.x };
        clickableObjects.push(rocketGroup);

        let rocketState = 'idle'; // 'idle', 'liftoff_straight', 'orbiting', 'reentry_descent'
        let rocketOrbitAngle = 0;

        window.triggerRocketLaunch = function() {
            if (rocketState !== 'idle') return;
            rocketState = 'liftoff_straight';
            rocketFlame.visible = true;
            robotSpeak("Rocket ignition! Vertical liftoff out of the atmosphere!");
            playAction('Cheer');
        };

        // --- LOAD 3D CHARACTER (COSMO IN FOREGROUND) ---
        let modelContainer = new THREE.Group();
        modelContainer.position.set(0, -15.2, 0);
        scene.add(modelContainer);
        
        let mixer;
        const actions = {};
        let activeAction;

        const loader = new GLTFLoader();
        loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb', (gltf) => {
            const model = gltf.scene;
            model.position.set(0, 0, 0);
            model.scale.set(1.4, 1.9, 1.4);
            modelContainer.add(model);

            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                gltf.animations.forEach((clip) => {
                    actions[clip.name] = mixer.clipAction(clip);
                });
                if (actions['Dance']) {
                    activeAction = actions['Dance'];
                    activeAction.play();
                    robotSpeak("Hi, I'm Cosmo! Explore the solar system!");
                }
            }

            document.getElementById('ui-toolbar').style.opacity = '1';
            const loaderElem = document.getElementById('loading');
            if (loaderElem) {
                loaderElem.style.opacity = '0';
                setTimeout(() => loaderElem.remove(), 500);
            }
        });

        window.playAction = function(name) {
            if (!actions[name] || activeAction === actions[name]) return;
            const previousAction = activeAction;
            activeAction = actions[name];
            activeAction.reset().fadeIn(0.5).play();
            previousAction.fadeOut(0.5);
        };

        // --- GEMINI AI FUN FACT FETCH ---
        async function fetchCelestialFunFact(objectName) {
            setButtonState('thinking');
            try {
                const response = await fetch('/ask-gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: `Tell me a short, fascinating, and random fun fact about ${objectName} in 2 sentences max, spoken as a friendly robot companion named Cosmo.` })
                });
                const data = await response.json();
                if (data.answer) {
                    robotSpeak(data.answer);
                } else {
                    robotSpeak(`${objectName} is an amazing marvel of space!`);
                }
            } catch (error) {
                console.error("Gemini request failed:", error);
                robotSpeak(`${objectName} is full of cosmic mysteries!`);
            }
        }

        let isCinematicZoom = false;
        let cinematicTargetLook = new THREE.Vector3(0, -6.5, 0);

        function zoomToTarget(mesh) {
            const worldPos = new THREE.Vector3();
            mesh.getWorldPosition(worldPos);
            cinematicTargetLook.copy(worldPos);
            isCinematicZoom = true;
            setTimeout(() => { isCinematicZoom = false; }, 4000);
        }

        // --- CLICK & TAP HANDLER ---
        function handleInteraction(clientX, clientY) {
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            sunGroup.updateMatrixWorld(true);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                playChimeSound();
                let clickedObject = intersects[0].object;
                let searchObj = clickedObject;
                while(searchObj && !searchObj.userData.planetName && !searchObj.userData.isRocket) {
                    searchObj = searchObj.parent;
                }

                if (searchObj === rocketGroup || (searchObj && searchObj.userData.isRocket)) {
                    triggerRocketLaunch();
                    return;
                }

                if (searchObj && searchObj.userData && searchObj.userData.planetName) {
                    fetchCelestialFunFact(searchObj.userData.planetName);
                    zoomToTarget(searchObj);
                    if (actions['Wave']) window.playAction('Wave');
                }
            }
        }

        window.addEventListener('click', (event) => {
            if (event.target.closest('#ui-toolbar') || event.target.closest('#top-mic-container') || event.target.closest('#planet-controls-container')) return;
            handleInteraction(event.clientX, event.clientY);
        });

        window.addEventListener('touchend', (event) => {
            if (event.target.closest('#ui-toolbar') || event.target.closest('#top-mic-container') || event.target.closest('#planet-controls-container')) return;
            if (event.changedTouches.length > 0) {
                const touch = event.changedTouches[0];
                handleInteraction(touch.clientX, touch.clientY);
            }
        }, { passive: true });

        // --- AUDIO & VOICE SETUP ---
        let audioCtx = null;
        let isSpeakingNow = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playChimeSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function setButtonState(state) {
            const micBtn = document.getElementById('mic-toggle');
            micBtn.classList.remove('state-active-hearing', 'state-listening', 'state-thinking', 'state-talking');

            if (state === 'active-hearing') {
                micBtn.classList.add('state-active-hearing');
                micBtn.innerText = "🔴 Listening...";
            } else if (state === 'listening') {
                micBtn.classList.add('state-listening');
                micBtn.innerText = "🟢 Voice Detected";
            } else if (state === 'thinking') {
                micBtn.classList.add('state-thinking');
                micBtn.innerText = "🟡 Thinking...";
            } else if (state === 'talking') {
                micBtn.classList.add('state-talking');
                micBtn.innerText = "🔵 Talking...";
            } else {
                micBtn.innerText = "🎤 Ask Cosmo";
            }
        }

        function robotSpeak(text) {
            initAudio();
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            isSpeakingNow = true;
            setButtonState('talking');
            
            const bubble = document.getElementById('speech-bubble');
            bubble.innerText = text;
            bubble.classList.add('visible');

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.65;
            utterance.pitch = 0.4;
            utterance.onend = () => {
                isSpeakingNow = false;
                bubble.classList.remove('visible');
                if (isListening) {
                    setButtonState('active-hearing');
                } else {
                    setButtonState('idle');
                }
            };
            window.speechSynthesis.speak(utterance);
        }

        let recognition = null;
        let isListening = false;
        let mediaStream = null;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onspeechstart = () => {
                if (isListening && !isSpeakingNow) setButtonState('listening');
            };

            recognition.onresult = (event) => {
                if (isSpeakingNow) return;
                const latestResult = event.results[event.results.length - 1];
                let speechToText = latestResult[0].transcript.trim().toLowerCase();
                
                setButtonState('listening');
                if (!latestResult.isFinal) return;

                setButtonState('thinking');
                window.speechSynthesis.cancel();

                if (speechToText.includes('dance')) {
                    window.playAction('Dance');
                    robotSpeak("Dancing time!");
                } else if (speechToText.includes('jump')) {
                    window.playAction('Jump');
                    robotSpeak("Wheee!");
                } else if (speechToText.includes('rocket') || speechToText.includes('launch')) {
                    triggerRocketLaunch();
                } else {
                    fetch('/ask-gemini', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ question: speechToText })
                    }).then(res => res.json()).then(data => {
                        if (data.answer) robotSpeak(data.answer);
                    }).catch(() => {
                        robotSpeak("I couldn't reach mission control!");
                    });
                }
            };

            recognition.onend = () => {
                if (isListening && !isSpeakingNow) {
                    try { recognition.start(); setButtonState('active-hearing'); } catch(e){}
                }
            };
        }

        window.toggleVoiceRecognition = async function() {
            initAudio();
            if (!recognition) {
                alert("Voice recognition not supported.");
                return;
            }
            if (!isListening) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    isListening = true;
                    setButtonState('active-hearing');
                    recognition.start();
                    robotSpeak("I'm listening!");
                } catch(e) {
                    alert("Microphone permission denied.");
                }
            } else {
                stopListening();
            }
        };

        function stopListening() {
            isListening = false;
            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            setButtonState('idle');
        }

        // --- ANIMATION LOOP ---
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            if (mixer) mixer.update(deltaTime);

            if (rocketState === 'liftoff_straight') {
                rocketFlame.visible = true;
                rocketGroup.rotation.set(0, 0, 0);
                rocketGroup.position.y += 12.0 * deltaTime;

                if (rocketGroup.position.y > 20.0) {
                    rocketState = 'orbiting';
                    rocketOrbitAngle = 0;
                    robotSpeak("Entered solar orbit!");
                }
            } else if (rocketState === 'orbiting') {
                rocketFlame.visible = true;
                rocketOrbitAngle += deltaTime * 2.0;

                const orbitRadius = 16.0;
                const sunWorldPos = new THREE.Vector3(0, 4.0, -45); // Deep background sun position
                
                const targetX = sunWorldPos.x + Math.cos(rocketOrbitAngle) * orbitRadius;
                const targetY = sunWorldPos.y + Math.sin(rocketOrbitAngle * 0.5) * 4.0;
                const targetZ = sunWorldPos.z + Math.sin(rocketOrbitAngle) * orbitRadius;

                const nextX = sunWorldPos.x + Math.cos(rocketOrbitAngle + 0.05) * orbitRadius;
                const nextY = sunWorldPos.y + Math.sin((rocketOrbitAngle + 0.05) * 0.5) * 4.0;
                const nextZ = sunWorldPos.z + Math.sin(rocketOrbitAngle + 0.05) * orbitRadius;
                
                rocketGroup.position.set(targetX, targetY, targetZ);
                rocketGroup.lookAt(nextX, nextY, nextZ);
                rocketGroup.rotateX(Math.PI / 2);

                if (rocketOrbitAngle >= Math.PI * 4) {
                    rocketState = 'reentry_descent';
                    rocketGroup.position.set(4.4, 25.0, 1.0);
                    rocketGroup.rotation.set(0, 0, 0); 
                    robotSpeak("Re-entry burn! Returning from above!");
                }
            } else if (rocketState === 'reentry_descent') {
                rocketFlame.visible = true;
                rocketGroup.rotation.set(0, 0, 0);
                rocketGroup.position.y -= 10.0 * deltaTime;

                if (rocketGroup.position.y <= rocketOriginalPos.y) {
                    rocketGroup.position.copy(rocketOriginalPos);
                    rocketGroup.rotation.set(0, 0, 0);
                    rocketFlame.visible = false;
                    rocketState = 'idle';
                    robotSpeak("Touchdown! Safe back at base!");
                }
            }

            starField.rotation.y += deltaTime * 0.005;

            planetOrbits.forEach((orbit, index) => {
                orbit.rotation.y += planetSpeeds[index] * globalOrbitSpeedMultiplier * deltaTime;
            });

            sunMesh.rotation.y += deltaTime * 0.2;
            earthMesh.rotation.y += deltaTime * 0.4;

            if (isCinematicZoom) {
                controls.target.lerp(cinematicTargetLook, 3 * deltaTime);
            } else {
                controls.target.lerp(new THREE.Vector3(0, -6.5, 0), 3 * deltaTime);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
