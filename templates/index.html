<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmo's Interactive Space & Solar System Adventure</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010206;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        .zzz {
            position: absolute;
            color: #93c5fd;
            font-weight: bold;
            font-family: monospace;
            pointer-events: none;
            user-select: none;
            opacity: 0;
            z-index: 15;
            transition: transform 1.5s ease-out, opacity 1.5s ease-out;
        }
        
        /* Speech Bubble */
        #speech-bubble {
            position: absolute;
            top: 75px;
            right: 20px;
            background: rgba(15, 23, 42, 0.9);
            border: 2px solid rgba(99, 102, 241, 0.85);
            color: #f8fafc;
            padding: 10px 18px;
            border-radius: 16px;
            font-size: 0.95rem;
            font-weight: 500;
            max-width: 260px;
            text-align: left;
            pointer-events: none;
            z-index: 25;
            opacity: 0;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
            transition: opacity 0.2s ease, transform 0.2s ease;
            transform: translateY(-5px);
        }
        #speech-bubble.visible {
            opacity: 1;
            transform: translateY(0);
        }

        #top-mic-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 25;
        }

        /* Top-Left Planet & Solar System Controls (Lowered below Sun) */
        #planet-controls-container {
            position: absolute;
            top: 260px;
            left: 20px;
            z-index: 25;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
        }

        .action-btn {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(51, 65, 85, 1);
            color: #e2e8f0;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .action-btn:hover {
            background: rgba(79, 70, 229, 0.9);
            border-color: rgba(99, 102, 241, 1);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px -3px rgba(79, 70, 229, 0.4);
        }
        .action-btn.active {
            background: rgb(79, 70, 229);
            border-color: rgb(99, 102, 241);
            color: white;
        }

        /* Speed Slider Control Box */
        #speed-control-box {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(51, 65, 85, 1);
            padding: 8px 14px;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e2e8f0;
            font-size: 0.8rem;
            font-weight: 600;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        #speed-slider {
            accent-color: #6366f1;
            cursor: pointer;
            width: 90px;
        }
        
        .mic-btn {
            background: rgba(220, 38, 38, 0.8);
            border: 1px solid rgba(239, 68, 68, 1);
            color: white;
        }
        .mic-btn.state-listening {
            background: rgba(16, 185, 129, 0.9);
            border-color: rgba(52, 211, 153, 1);
            animation: pulse-green 1.5s infinite;
        }
        .mic-btn.state-getting {
            background: rgba(37, 99, 235, 0.9);
            border-color: rgba(96, 165, 250, 1);
            animation: pulse-blue 1.5s infinite;
        }
        .mic-btn.state-thinking {
            background: rgba(234, 179, 8, 0.9);
            border-color: rgba(250, 204, 21, 1);
            animation: pulse-yellow 1.5s infinite;
        }

        @keyframes pulse-green {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        @keyframes pulse-blue {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        @keyframes pulse-yellow {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(234, 179, 8, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(234, 179, 8, 0); }
        }
    </style>
</head>
<body>

    <div id="loading">Loading Immersive Space...</div>
    <div id="canvas-container"></div>
    <div id="zzz-container"></div>
    <div id="speech-bubble"></div>

    <div id="top-mic-container">
        <button id="mic-toggle" class="action-btn mic-btn" onclick="toggleVoiceRecognition()">🎤 Click to Ask Cosmo</button>
    </div>

    <!-- Top-Left Planet Controls (Lowered below Sun) -->
    <div id="planet-controls-container">
        <button id="constellation-btn" class="action-btn" onclick="toggleConstellations()">✨ Constellations</button>
        <div id="speed-control-box">
            <span>🪐 Orbit: <span id="speed-val">1.0</span>x</span>
            <input type="range" id="speed-slider" min="0" max="5" step="0.1" value="1.0" oninput="updateOrbitSpeed(this.value)">
        </div>
    </div>

    <!-- Bottom Cosmo Action Toolbar -->
    <div id="ui-toolbar" class="absolute bottom-8 left-0 right-0 z-20 flex flex-wrap justify-center items-center gap-3 px-4 pointer-events-auto opacity-0 transition-opacity duration-500">
        <button class="action-btn" onclick="playAction('Idle')">Idle</button>
        <button class="action-btn" onclick="playAction('Walking')">Walk</button>
        <button class="action-btn" onclick="playAction('Running')">Run</button>
        <button class="action-btn active" onclick="playAction('Dance')">Dance</button>
        <button class="action-btn" onclick="playAction('Jump')">Jump</button>
        <button class="action-btn" onclick="playAction('Wave')">Wave</button>
        <button class="action-btn" onclick="playAction('Punch')">Punch</button>
        <button class="action-btn" onclick="playAction('Yes')">Thumbs Up</button>
        <button class="action-btn" onclick="playAction('Sitting')">Sit</button>
        <button class="action-btn" onclick="playAction('Death')">Sleep</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const container = document.getElementById('canvas-container');
        
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010206);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, -3, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.set(0, -4.0, 0);

        controls.mouseButtons = {
            LEFT: null,
            MIDDLE: THREE.MOUSE.DOLLY,
            RIGHT: THREE.MOUSE.ROTATE
        };

        renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());

        const ambientLight = new THREE.AmbientLight(0x222233, 1.0);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 4.0);
        sunLight.position.set(-30, 20, 20);
        scene.add(sunLight);

        const clickableObjects = [];
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // --- DEEP SPACE & NEBULA BACKGROUND ---
        const starsGeo = new THREE.BufferGeometry();
        const starsCount = 3000;
        const starPos = new Float32Array(starsCount * 3);
        for(let i = 0; i < starsCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 600;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({ size: 0.6, color: 0xffffff, transparent: true, opacity: 0.9 });
        const starField = new THREE.Points(starsGeo, starsMat);
        scene.add(starField);

        // --- CONSTELLATIONS GROUP ---
        const constellationGroup = new THREE.Group();
        constellationGroup.visible = false;
        scene.add(constellationGroup);

        function generateConstellations() {
            const lineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.4 });
            for (let i = 0; i < 8; i++) {
                const points = [];
                let curr = new THREE.Vector3(
                    (Math.random() - 0.5) * 300,
                    (Math.random() - 0.5) * 200,
                    -100 - Math.random() * 100
                );
                points.push(curr);

                for (let j = 0; j < 4; j++) {
                    const next = curr.clone().add(new THREE.Vector3(
                        (Math.random() - 0.5) * 40,
                        (Math.random() - 0.5) * 40,
                        (Math.random() - 0.5) * 20
                    ));
                    points.push(next);
                    curr = next;
                }

                const geom = new THREE.BufferGeometry().setFromPoints(points);
                const line = new THREE.Line(geom, lineMat);
                const starNodeGeo = new THREE.SphereGeometry(1.5, 8, 8);
                const starNodeMat = new THREE.MeshBasicMaterial({ color: 0x93c5fd });

                points.forEach(pt => {
                    const node = new THREE.Mesh(starNodeGeo, starNodeMat);
                    node.position.copy(pt);
                    constellationGroup.add(node);
                });

                constellationGroup.add(line);
            }
        }
        generateConstellations();

        let constellationsActive = false;
        window.toggleConstellations = function() {
            constellationsActive = !constellationsActive;
            constellationGroup.visible = constellationsActive;
            const btn = document.getElementById('constellation-btn');

            if (constellationsActive) {
                btn.classList.add('active');
                robotSpeak("Constellation mode enabled! Behold the stellar star maps.");
            } else {
                btn.classList.remove('active');
                robotSpeak("Constellation mode disabled.");
            }
        };

        const nebulaGroup = new THREE.Group();
        scene.add(nebulaGroup);
        const nebulaColors = [0x3b82f6, 0x8b5cf6, 0xec4899, 0x06b6d4];
        for (let i = 0; i < 6; i++) {
            const cloudGeo = new THREE.SphereGeometry(40 + Math.random() * 20, 16, 16);
            const cloudMat = new THREE.MeshBasicMaterial({
                color: nebulaColors[i % nebulaColors.length],
                transparent: true,
                opacity: 0.04,
                blending: THREE.AdditiveBlending
            });
            const cloud = new THREE.Mesh(cloudGeo, cloudMat);
            cloud.position.set(
                (Math.random() - 0.5) * 300,
                (Math.random() - 0.5) * 200,
                -150 - Math.random() * 150
            );
            nebulaGroup.add(cloud);
        }

        const shootingStars = [];
        function spawnShootingStar() {
            playWhooshSound();
            const streakGeo = new THREE.BufferGeometry();
            const positions = new Float32Array([0, 0, 0, -5, 2, -10]);
            streakGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const streakMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 1.0 });
            const streak = new THREE.Line(streakGeo, streakMat);

            streak.position.set(
                (Math.random() - 0.5) * 200,
                50 + Math.random() * 50,
                -50 - Math.random() * 100
            );
            streak.userData = {
                velocity: new THREE.Vector3(1.5 + Math.random() * 2, -1 - Math.random(), 0.5),
                life: 1.0
            };
            scene.add(streak);
            shootingStars.push(streak);
        }
        setInterval(spawnShootingStar, 5000);

        function createPlanetTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            if (type === 'earth') {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#15803d';
                ctx.beginPath();
                ctx.ellipse(300, 150, 120, 80, 0, 0, Math.PI * 2);
                ctx.ellipse(700, 180, 140, 90, 0.2, 0, Math.PI * 2);
                ctx.ellipse(550, 280, 160, 110, 0.1, 0, Math.PI * 2);
                ctx.ellipse(200, 350, 90, 70, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fde047';
                for(let i=0; i<150; i++) {
                    const cx = Math.random() * canvas.width;
                    const cy = Math.random() * canvas.height;
                    ctx.fillRect(cx, cy, 2, 2);
                }
            } else if (type === 'jupiter') {
                const colors = ['#b45309', '#d97706', '#92400e', '#f59e0b', '#78350f', '#b45309'];
                const stripeHeight = canvas.height / colors.length;
                colors.forEach((col, idx) => {
                    ctx.fillStyle = col;
                    ctx.fillRect(0, idx * stripeHeight, canvas.width, stripeHeight + 2);
                });
            }

            return new THREE.CanvasTexture(canvas);
        }

        // --- SUN & PLANETS ---
        const sunGroup = new THREE.Group();
        sunGroup.position.set(-38, 5, -45);
        scene.add(sunGroup);

        const sunMesh = new THREE.Mesh(
            new THREE.SphereGeometry(9.0, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xf59e0b })
        );
        sunMesh.geometry.computeBoundingSphere();
        sunMesh.userData = { planetName: "Sun", originalScale: sunMesh.scale.x };
        sunGroup.add(sunMesh);
        clickableObjects.push(sunMesh);

        const localSunLight = new THREE.PointLight(0xffedd5, 8.0, 400);
        sunGroup.add(localSunLight);

        const planetOrbits = [];
        const planetSpeeds = [];
        let globalOrbitSpeedMultiplier = 1.0;

        window.updateOrbitSpeed = function(val) {
            globalOrbitSpeedMultiplier = parseFloat(val);
            document.getElementById('speed-val').innerText = globalOrbitSpeedMultiplier.toFixed(1);
        };

        function createOrbitPlanet(radius, color, distance, speed, hasRings = false, textureType = null, customName = null) {
            const orbit = new THREE.Group();
            sunGroup.add(orbit);

            const orbitLineGeo = new THREE.RingGeometry(distance - 0.08, distance + 0.08, 128);
            const orbitLineMat = new THREE.MeshBasicMaterial({ 
                color: color || 0x38bdf8, 
                side: THREE.DoubleSide, 
                transparent: true, 
                opacity: 0.25,
                blending: THREE.AdditiveBlending 
            });
            const orbitLine = new THREE.Mesh(orbitLineGeo, orbitLineMat);
            orbitLine.rotation.x = Math.PI / 2;
            sunGroup.add(orbitLine);

            let material;
            if (textureType) {
                material = new THREE.MeshStandardMaterial({ 
                    map: createPlanetTexture(textureType), 
                    roughness: 0.6,
                    metalness: 0.1
                });
            } else {
                material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.7 });
            }

            const geo = new THREE.SphereGeometry(radius, 32, 32);
            geo.computeBoundingSphere();
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.x = distance;
            orbit.add(mesh);

            const name = customName || getPlanetName(distance);
            mesh.userData = { planetName: name, originalScale: mesh.scale.x };
            clickableObjects.push(mesh);

            const glowGeo = new THREE.SphereGeometry(radius * 1.15, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({ color: color || 0x38bdf8, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending });
            const glowMesh = new THREE.Mesh(glowGeo, glowMat);
            mesh.add(glowMesh);

            if (hasRings) {
                const ringGeo = new THREE.RingGeometry(radius * 1.3, radius * 2.0, 32);
                ringGeo.computeBoundingSphere();
                const ringMat = new THREE.MeshBasicMaterial({ color: 0xd4d4d8, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.rotation.x = Math.PI / 2.2;
                ring.userData = { planetName: "Saturn", originalScale: ring.scale.x };
                mesh.add(ring);
                clickableObjects.push(ring);
            }

            planetOrbits.push(orbit);
            planetSpeeds.push(speed);

            return mesh;
        }

        function getPlanetName(distance) {
            if (distance === 12) return "Mercury";
            if (distance === 18) return "Venus";
            if (distance === 26) return "Earth";
            if (distance === 34) return "Mars";
            if (distance === 44) return "Jupiter";
            if (distance === 54) return "Saturn";
            if (distance === 64) return "Uranus";
            if (distance === 74) return "Neptune";
            return "Planet";
        }

        createOrbitPlanet(0.5, 0xa1a1aa, 12, 0.14);
        createOrbitPlanet(0.9, 0xf97316, 18, 0.11);
        
        const earthMesh = createOrbitPlanet(1.2, 0x2563eb, 26, 0.08, false, 'earth', "Earth");
        
        const cloudGeo = new THREE.SphereGeometry(1.25, 32, 32);
        cloudGeo.computeBoundingSphere();
        const cloudMesh = new THREE.Mesh(
            cloudGeo,
            new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, blending: THREE.AdditiveBlending })
        );
        cloudMesh.userData = { planetName: "Earth", originalScale: cloudMesh.scale.x };
        earthMesh.add(cloudMesh);
        clickableObjects.push(cloudMesh);

        const moonGeo = new THREE.SphereGeometry(0.25, 16, 16);
        moonGeo.computeBoundingSphere();
        const moonMesh = new THREE.Mesh(
            moonGeo,
            new THREE.MeshStandardMaterial({ color: 0x9ca3af })
        );
        moonMesh.userData = { planetName: "Moon", originalScale: moonMesh.scale.x };
        earthMesh.add(moonMesh);
        clickableObjects.push(moonMesh);

        createOrbitPlanet(0.8, 0xdc2626, 34, 0.06);
        createOrbitPlanet(2.2, 0xb45309, 44, 0.035, false, 'jupiter');
        createOrbitPlanet(1.8, 0xfde047, 54, 0.025, true);
        createOrbitPlanet(1.3, 0x38bdf8, 64, 0.018);
        createOrbitPlanet(1.2, 0x3b82f6, 74, 0.012);

        // --- ROCKET SHIP ---
        const rocketGroup = new THREE.Group();
        const rocketOriginalPos = new THREE.Vector3(4.5, -5.5, 1.5);
        rocketGroup.position.copy(rocketOriginalPos);
        rocketGroup.scale.set(1.4, 1.4, 1.4);
        scene.add(rocketGroup);

        const metalMat = new THREE.MeshStandardMaterial({ color: 0xf1f5f9, metalness: 0.8, roughness: 0.2 });
        const redMat = new THREE.MeshStandardMaterial({ color: 0xef4444, metalness: 0.5, roughness: 0.3 });
        const darkMetalMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.9, roughness: 0.2 });
        const windowMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, emissive: 0x0284c7, emissiveIntensity: 0.8, roughness: 0.1 });

        const bodyMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.6, 2.2, 32), metalMat);
        bodyMesh.position.y = 1.1;
        rocketGroup.add(bodyMesh);

        const noseMesh = new THREE.Mesh(new THREE.ConeGeometry(0.5, 1.0, 32), redMat);
        noseMesh.position.y = 2.7;
        rocketGroup.add(noseMesh);

        const windowMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.1, 16), windowMat);
        windowMesh.rotation.x = Math.PI / 2;
        windowMesh.position.set(0, 1.5, 0.48);
        rocketGroup.add(windowMesh);

        for (let i = 0; i < 3; i++) {
            const finGeo = new THREE.BoxGeometry(0.08, 0.8, 0.6);
            const fin = new THREE.Mesh(finGeo, redMat);
            const angle = (i * 2 * Math.PI) / 3;
            fin.position.set(Math.cos(angle) * 0.5, 0.4, Math.sin(angle) * 0.5);
            fin.rotation.y = angle;
            fin.rotation.x = 0.2;
            rocketGroup.add(fin);
        }

        const nozzle = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.4, 16), darkMetalMat);
        nozzle.position.y = -0.2;
        rocketGroup.add(nozzle);

        const flameGeo = new THREE.ConeGeometry(0.6, 2.5, 16);
        const flameMat = new THREE.MeshBasicMaterial({ color: 0xf97316, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending });
        const rocketFlame = new THREE.Mesh(flameGeo, flameMat);
        rocketFlame.position.y = -1.5;
        rocketFlame.rotation.x = Math.PI;
        rocketFlame.visible = false;
        rocketGroup.add(rocketFlame);

        rocketGroup.userData = { isRocket: true, originalScale: rocketGroup.scale.x };
        clickableObjects.push(rocketGroup);

        let rocketState = 'idle'; // 'idle', 'launching', 'descending'
        let rocketVelocity = 0;
        let rocketLaunchTimer = 0;

        window.triggerRocketLaunch = function() {
            if (rocketState !== 'idle') return;
            rocketState = 'launching';
            rocketVelocity = 0.02;
            rocketLaunchTimer = 0;
            rocketFlame.visible = true;
            robotSpeak("Rocket ignition! Heavy liftoff in progress...");
            playAction('Cheer');

            // After 3.5 seconds, start slow descent back to base
            setTimeout(() => {
                rocketState = 'descending';
                rocketGroup.position.y = 45; // Start descent from upper sky
                rocketVelocity = 0.5; // Controlled initial descent speed
                robotSpeak("Mission accomplished! Initiating controlled descent back to base...");
            }, 3500);
        };

        // --- FETCH GEMINI FUN FACT FOR CELESTIAL OBJECTS ---
        async function fetchCelestialFunFact(objectName) {
            try {
                const response = await fetch('/ask-gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: `Tell me a short, fascinating, and random fun fact about ${objectName} in 2 sentences max, spoken as a friendly robot companion named Cosmo.` })
                });
                const data = await response.json();
                if (data.answer) {
                    robotSpeak(data.answer);
                } else {
                    robotSpeak(`${objectName} is an amazing marvel of our solar system!`);
                }
            } catch (error) {
                console.error("Gemini request failed:", error);
                robotSpeak(`${objectName} is full of cosmic mysteries!`);
            }
        }

        // --- CINEMATIC CAMERA ZOOM MODE ---
        let isCinematicZoom = false;
        let cinematicTargetLook = new THREE.Vector3(0, -4, 0);

        function zoomToTarget(mesh) {
            const worldPos = new THREE.Vector3();
            mesh.getWorldPosition(worldPos);
            cinematicTargetLook.copy(worldPos);
            isCinematicZoom = true;
            setTimeout(() => {
                isCinematicZoom = false;
            }, 4000);
        }

        // --- HOVER EFFECT ---
        let hoveredObject = null;
        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            sunGroup.updateMatrixWorld(true);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                if (hoveredObject !== hit) {
                    if (hoveredObject && hoveredObject.userData.originalScale) {
                        hoveredObject.scale.set(hoveredObject.userData.originalScale, hoveredObject.userData.originalScale, hoveredObject.userData.originalScale);
                    }
                    hoveredObject = hit;
                    document.body.style.cursor = 'pointer';
                }
                if (hoveredObject.userData.originalScale) {
                    hoveredObject.scale.set(
                        hoveredObject.userData.originalScale * 1.25,
                        hoveredObject.userData.originalScale * 1.25,
                        hoveredObject.userData.originalScale * 1.25
                    );
                }
            } else {
                if (hoveredObject && hoveredObject.userData.originalScale) {
                    hoveredObject.scale.set(hoveredObject.userData.originalScale, hoveredObject.userData.originalScale, hoveredObject.userData.originalScale);
                }
                hoveredObject = null;
                document.body.style.cursor = 'default';
            }
        });

        // --- BUTTON STATE MANAGEMENT HELPER ---
        function setButtonState(state) {
            const micBtn = document.getElementById('mic-toggle');
            micBtn.classList.remove('state-listening', 'state-getting', 'state-thinking');

            if (state === 'listening') {
                micBtn.classList.add('state-listening');
                micBtn.innerText = "🟢 listening";
            } else if (state === 'getting') {
                micBtn.classList.add('state-getting');
                micBtn.innerText = "🔵 getting your question";
            } else if (state === 'thinking') {
                micBtn.classList.add('state-thinking');
                micBtn.innerText = "🟡 thinking";
            } else {
                micBtn.innerText = "🎤 Click to Ask Cosmo";
            }
        }

        // --- VOICE & AUDIO SETUP ---
        let audioCtx = null;
        let isSpeakingNow = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playChimeSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(523.25, now);
            osc.frequency.exponentialRampToValueAtTime(1046.50, now + 0.3);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        }

        function playWhooshSound() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.25);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.3);
        }

        function playRobotBeep() {
            initAudio();
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(700, now);
            osc.frequency.setValueAtTime(1100, now + 0.04);
            osc.frequency.setValueAtTime(500, now + 0.08);
            gain.gain.setValueAtTime(0.06, now);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.12);
        }

        function showSpeechBubble(text) {
            const bubble = document.getElementById('speech-bubble');
            bubble.innerText = text;
            bubble.classList.add('visible');
        }

        function hideSpeechBubble() {
            const bubble = document.getElementById('speech-bubble');
            bubble.classList.remove('visible');
        }

        function robotSpeak(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();

            playRobotBeep();
            isSpeakingNow = true;
            showSpeechBubble(text);

            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.65;
            utterance.pitch = 0.4;
            utterance.volume = 1.0;

            utterance.onend = () => {
                isSpeakingNow = false;
                hideSpeechBubble();
                if (isListening && recognition) {
                    try { 
                        recognition.start(); 
                        setButtonState('listening');
                    } catch(e){}
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // --- GEMINI AI INTEGRATION ---
        let isProcessingAI = false;

        async function askCosmoAI(question) {
            if (!question) return;
            
            window.speechSynthesis.cancel();
            isProcessingAI = true;
            setButtonState('thinking');

            const qLower = question.toLowerCase();

            if (qLower.includes('constellation') || qLower.includes('stars')) {
                toggleConstellations();
                isProcessingAI = false;
                return;
            } else if (qLower.includes('rocket') || qLower.includes('launch')) {
                triggerRocketLaunch();
                isProcessingAI = false;
                return;
            } else if (qLower.includes('speed up') || qLower.includes('faster')) {
                globalOrbitSpeedMultiplier = 2.5;
                document.getElementById('speed-slider').value = 2.5;
                document.getElementById('speed-val').innerText = "2.5";
                robotSpeak("Warp speed! Orbits are speeding up!");
                isProcessingAI = false;
                return;
            } else if (qLower.includes('slow down') || qLower.includes('slower')) {
                globalOrbitSpeedMultiplier = 0.3;
                document.getElementById('speed-slider').value = 0.3;
                document.getElementById('speed-val').innerText = "0.3";
                robotSpeak("Taking it nice and slow now.");
                isProcessingAI = false;
                return;
            } else if (qLower.includes('normal speed') || qLower.includes('reset speed')) {
                globalOrbitSpeedMultiplier = 1.0;
                document.getElementById('speed-slider').value = 1.0;
                document.getElementById('speed-val').innerText = "1.0";
                robotSpeak("Orbits back to normal speed.");
                isProcessingAI = false;
                return;
            }

            try {
                const response = await fetch('/ask-gemini', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question })
                });
                const data = await response.json();
                if (data.answer) {
                    robotSpeak(data.answer);
                }
            } catch (error) {
                console.error("AI request failed:", error);
                robotSpeak("I couldn't reach mission control!");
                isSpeakingNow = false;
                if (isListening) setButtonState('listening');
            } finally {
                isProcessingAI = false;
            }
        }

        // --- MOUSE CLICK INTERACTION ---
        window.addEventListener('click', (event) => {
            if (event.target.closest('#ui-toolbar') || event.target.closest('#top-mic-container') || event.target.closest('#planet-controls-container')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            sunGroup.updateMatrixWorld(true);

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects, true);

            if (intersects.length > 0) {
                playChimeSound();
                let clickedObject = intersects[0].object;
                
                let searchObj = clickedObject;
                while(searchObj && !searchObj.userData.planetName && !searchObj.userData.isRocket) {
                    searchObj = searchObj.parent;
                }

                if (searchObj === rocketGroup || (searchObj && searchObj.userData.isRocket)) {
                    triggerRocketLaunch();
                    return;
                }

                if (searchObj && searchObj.userData && searchObj.userData.planetName) {
                    const planetName = searchObj.userData.planetName;
                    fetchCelestialFunFact(planetName);
                    zoomToTarget(searchObj);
                    if (actions['Wave']) {
                        window.playAction('Wave');
                    }
                }
            } else {
                spawnShootingStar();
            }
        });

        // --- BACKGROUND MUSIC ---
        let musicInterval = null;

        function playBackgroundMusic(actionName) {
            initAudio();
            if (musicInterval) clearInterval(musicInterval);

            let tempo = 400;
            let notes = [220, 277, 329, 440];

            if (actionName === 'Dance') {
                tempo = 150;
                notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99]; 
            } else if (actionName === 'Running') {
                tempo = 180;
                notes = [150, 300, 450, 600];
            } else if (actionName === 'Walking') {
                tempo = 500;
                notes = [200, 250, 300];
            } else if (actionName === 'Death' || actionName === 'Sitting') {
                tempo = 1200;
                notes = [130.81, 164.81, 196.00];
            }

            musicInterval = setInterval(() => {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                const freq = notes[Math.floor(Math.random() * notes.length)];
                osc.type = actionName === 'Dance' ? 'square' : ((actionName === 'Death' || actionName === 'Sitting') ? 'sine' : 'triangle');
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

                if (actionName === 'Dance') {
                    osc.frequency.setValueAtTime(freq * 1.5, audioCtx.currentTime + 0.05);
                }

                gain.gain.setValueAtTime(0, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(actionName === 'Dance' ? 0.06 : 0.08, audioCtx.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + (tempo / 1000) * 0.85);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + (tempo / 1000));
            }, tempo);
        }

        // 6. Load 3D Model
        let modelContainer = new THREE.Group();
        modelContainer.position.set(0, -6.2, 0); 
        scene.add(modelContainer);
        
        let mixer;
        const actions = {};
        let activeAction;
        let isStaticPose = false;
        let robotHeadBone = null;
        let targetCameraAngle = 0;

        const loader = new GLTFLoader();
        loader.load('https://threejs.org/examples/models/gltf/RobotExpressive/RobotExpressive.glb', (gltf) => {
            const model = gltf.scene;

            model.position.set(0, 0, 0);
            model.scale.set(1.5, 1.5, 1.5);
            modelContainer.add(model);

            model.traverse((child) => {
                if (child.isBone && child.name.toLowerCase().includes('head')) {
                    robotHeadBone = child;
                }
            });

            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                
                gltf.animations.forEach((clip) => {
                    const action = mixer.clipAction(clip);
                    actions[clip.name] = action;
                });

                if (actions['Dance']) {
                    activeAction = actions['Dance'];
                    activeAction.play();
                    playBackgroundMusic('Dance');
                    robotSpeak("Hi, I'm Cosmo! Click planets or chat with me!");
                }
            }

            document.getElementById('ui-toolbar').style.opacity = '1';
            const loaderElem = document.getElementById('loading');
            if (loaderElem) {
                loaderElem.style.opacity = '0';
                setTimeout(() => loaderElem.remove(), 500);
            }
        }, undefined, (error) => {
            console.error('An error occurred loading the GLTF model:', error);
            document.getElementById('loading').innerText = "Failed to load 3D model.";
        });

        const headVectorForZzz = new THREE.Vector3();

        function spawnZzz() {
            if (!isStaticPose || activeAction !== actions['Death']) return;

            const zzzContainer = document.getElementById('zzz-container');
            const zzz = document.createElement('div');
            zzz.className = 'zzz';
            zzz.innerText = 'Z';
            
            const size = Math.floor(Math.random() * 14) + 16;
            zzz.style.fontSize = `${size}px`;

            headVectorForZzz.set(0, 1.5, 0);
            if (robotHeadBone) {
                robotHeadBone.getWorldPosition(headVectorForZzz);
                headVectorForZzz.y += 0.8;
            }

            headVectorForZzz.project(camera);

            const screenX = (headVectorForZzz.x *  .5 + .5) * window.innerWidth + (Math.random() * 30 - 15);
            const screenY = (headVectorForZzz.y * -.5 + .5) * window.innerHeight + (Math.random() * 20 - 10);
            
            zzz.style.left = `${screenX}px`;
            zzz.style.top = `${screenY}px`;

            zzzContainer.appendChild(zzz);

            requestAnimationFrame(() => {
                zzz.style.opacity = '1';
                zzz.style.transform = `translate(${(Math.random() - 0.5) * 50}px, -80px) scale(1.3)`;
            });

            setTimeout(() => {
                zzz.remove();
            }, 1500);
        }

        setInterval(() => {
            if (isStaticPose) {
                spawnZzz();
            }
        }, 500);

        window.playAction = function(name) {
            if (!actions[name] || activeAction === actions[name]) return;

            const previousAction = activeAction;
            activeAction = actions[name];

            activeAction.setLoop(THREE.LoopRepeat);
            activeAction.clampWhenFinished = false;

            if (name === 'Dance') {
                robotSpeak("Hit the dance floor! Woohoo!");
            } else if (name === 'Walking') {
                robotSpeak("Space walk.");
            } else if (name === 'Running') {
                robotSpeak("Warp speed!");
            } else if (name === 'Jump') {
                robotSpeak("Whee, zero gravity!");
            } else if (name === 'Wave') {
                robotSpeak("Hello space friend!");
            } else if (name === 'Punch') {
                robotSpeak("Pow! Space punch!");
            } else if (name === 'Yes') {
                robotSpeak("You got it!");
            } else if (name === 'Sitting') {
                activeAction.setLoop(THREE.LoopOnce);
                activeAction.clampWhenFinished = true;
                isStaticPose = true;
                robotSpeak("Taking a seat.");
            } else if (name === 'Idle') {
                robotSpeak("Standing by.");
            } else if (name === 'Cheer') {
                robotSpeak("Hooray! Let's go!");
            }

            if (name === 'Death') {
                activeAction.setLoop(THREE.LoopOnce);
                activeAction.clampWhenFinished = true;
                isStaticPose = true;
                targetCameraAngle = Math.PI / 2;
                robotSpeak("Good night. Zzz...");
            } else if (name !== 'Sitting') {
                isStaticPose = false;
                document.getElementById('zzz-container').innerHTML = '';
                targetCameraAngle = 0;
            }

            previousAction.fadeOut(0.5);
            activeAction.reset().fadeIn(0.5).play();

            playBackgroundMusic(name);

            document.querySelectorAll('.action-btn').forEach(btn => {
                if (btn.id === 'constellation-btn') return;
                const bText = btn.innerText.toLowerCase();
                const targetText = name === 'Death' ? 'sleep' : (name === 'Yes' ? 'thumbs up' : (name === 'Sitting' ? 'sit' : name.toLowerCase()));
                if (bText === targetText) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        };

        // --- VOICE RECOGNITION SETUP ---
        let recognition = null;
        let isListening = false;
        let mediaStream = null;

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onspeechstart = () => {
                if (isListening && !isSpeakingNow) {
                    window.speechSynthesis.cancel(); 
                    hideSpeechBubble();
                    setButtonState('getting');
                }
            };

            recognition.onspeechend = () => {
                if (isListening && !isProcessingAI && !isSpeakingNow) {
                    setButtonState('listening');
                }
            };

            recognition.onresult = (event) => {
                if (isSpeakingNow) return;

                const results = event.results;
                const latestResult = results[results.length - 1];
                let speechToText = latestResult[0].transcript.trim().toLowerCase();
                
                setButtonState('getting');

                if (!latestResult.isFinal) {
                    return;
                }

                if (!speechToText) {
                    if (isListening) setButtonState('listening');
                    return;
                }

                console.log("User valid speech heard:", speechToText);

                setButtonState('thinking');
                window.speechSynthesis.cancel();

                if (speechToText.includes('dance')) {
                    window.playAction('Dance');
                    if (isListening) setTimeout(() => setButtonState('listening'), 1000);
                } else if (speechToText.includes('walk') || speechToText.includes('walking')) {
                    window.playAction('Walking');
                    if (isListening) setTimeout(() => setButtonState('listening'), 1000);
                } else if (speechToText.includes('run') || speechToText.includes('running')) {
                    window.playAction('Running');
                    if (isListening) setTimeout(() => setButtonState('listening'), 1000);
                } else if (speechToText.includes('jump')) {
                    window.playAction('Jump');
                    if (isListening) setTimeout(() => setButtonState('listening'), 1000);
                } else if (speechToText.includes('wave')) {
                    window.playAction('Wave');
                    if (isListening) setTimeout(() => setButtonState('listening'), 1000);
                } else if (speechToText.includes('punch')) {
                    window.playAction('Punch');
                    if (isListening) setTimeout(() => setButtonState('listening'), 1000);
                } else if (speechToText.includes('sit')) {
                    window.playAction('Sitting');
                    if (isListening) setTimeout(() => setButtonState('listening'), 1000);
                } else if (speechToText.includes('sleep') || speechToText.includes('death')) {
                    window.playAction('Death');
                    if (isListening) setTimeout(() => setButtonState('listening'), 1000);
                } else if (speechToText.includes('idle')) {
                    window.playAction('Idle');
                    if (isListening) setTimeout(() => setButtonState('listening'), 1000);
                } else {
                    askCosmoAI(speechToText);
                }
            };

            recognition.onerror = (event) => {
                console.error("Speech recognition error", event.error);
                if (isListening && !isSpeakingNow) {
                    try { recognition.start(); } catch(e){}
                }
            };

            recognition.onend = () => {
                if (isListening && !isSpeakingNow) {
                    try { 
                        recognition.start(); 
                        setButtonState('listening');
                    } catch(e){}
                }
            };
        }

        window.toggleVoiceRecognition = async function() {
            if (!recognition) {
                alert("Voice recognition is not supported in your browser. Try using Google Chrome.");
                return;
            }

            initAudio();

            if (!isListening) {
                try {
                    mediaStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true } 
                    });

                    isListening = true;
                    setButtonState('listening');

                    document.getElementById('mic-toggle').blur();
                    const syntheticClick = new MouseEvent('click', { clientX: 10, clientY: 10, bubbles: true });
                    renderer.domElement.dispatchEvent(syntheticClick);
                    window.focus();

                    recognition.start();
                    robotSpeak("I'm listening, ask me anything!");
                } catch (err) {
                    console.error("Microphone access error:", err);
                    alert("Please allow microphone access to talk with Cosmo!");
                }
            } else {
                stopListening();
            }
        };

        function stopListening() {
            isListening = false;
            hideSpeechBubble();
            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            setButtonState('off');
        }

        // 7. Animation Loop
        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            if (mixer) {
                mixer.update(deltaTime);
            }

            if (rocketState === 'launching') {
                rocketLaunchTimer += deltaTime;
                if (rocketLaunchTimer < 1.5) {
                    rocketVelocity += deltaTime * 2.0;
                } else {
                    rocketVelocity += deltaTime * 25.0;
                }
                rocketGroup.position.y += rocketVelocity * deltaTime * 10;
            } else if (rocketState === 'descending') {
                rocketFlame.visible = true;
                rocketGroup.position.y -= 8.0 * deltaTime; // Smooth descent speed
                if (rocketGroup.position.y <= rocketOriginalPos.y) {
                    rocketGroup.position.copy(rocketOriginalPos);
                    rocketFlame.visible = false;
                    rocketState = 'idle';
                    robotSpeak("Rocket has landed safely back at base!");
                }
            }

            starField.rotation.y += deltaTime * 0.005;
            nebulaGroup.rotation.y += deltaTime * 0.001;

            shootingStars.forEach((star, index) => {
                star.position.addScaledVector(star.userData.velocity, deltaTime * 20);
                star.userData.life -= deltaTime * 1.5;
                if (star.userData.life <= 0) {
                    scene.remove(star);
                    shootingStars.splice(index, 1);
                }
            });

            planetOrbits.forEach((orbit, index) => {
                orbit.rotation.y += planetSpeeds[index] * globalOrbitSpeedMultiplier * deltaTime;
            });

            sunMesh.rotation.y += deltaTime * 0.2;
            earthMesh.rotation.y += deltaTime * 0.4;
            cloudMesh.rotation.y += deltaTime * 0.15;
            moonMesh.position.x = Math.cos(elapsedTime * 0.8) * 1.8;
            moonMesh.position.z = Math.sin(elapsedTime * 0.8) * 1.8;

            const radius = 17;
            const currentAngle = Math.atan2(camera.position.x, camera.position.z);
            let targetAngle = targetCameraAngle;

            if (isCinematicZoom) {
                controls.target.lerp(cinematicTargetLook, 3 * deltaTime);
            } else {
                controls.target.lerp(new THREE.Vector3(0, -4.0, 0), 3 * deltaTime);
            }

            const newAngle = currentAngle + (targetAngle - currentAngle) * 3 * deltaTime;
            
            camera.position.x = Math.sin(newAngle) * radius;
            camera.position.z = Math.cos(newAngle) * radius;

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
